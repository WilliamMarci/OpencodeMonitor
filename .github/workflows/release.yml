name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version string for the .deb (ignored for tag builds)
        default: 0.0.0-dev

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.0.0-dev' }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build OpencodeMonitor.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name OpencodeMonitor --icon assets/icon.ico main.py
      - name: Smoke test
        run: |
          dist\OpencodeMonitor.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/OpencodeMonitor.exe
          if-no-files-found: error

  linux-deb:
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Build standalone binary
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name OpencodeMonitor main.py
      - name: Smoke test (offscreen render)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/OpencodeMonitor \
            --demo --screenshot /tmp/smoke.png
          test -s /tmp/smoke.png
      - name: Build .deb
        run: bash packaging/build_deb.sh "${{ needs.meta.outputs.version }}"
      - name: Inspect .deb
        run: dpkg-deb -I dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, windows, linux-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: OpencodeMonitor ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*
